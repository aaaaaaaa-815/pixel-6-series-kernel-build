name: Pixel 6 Kernel Build (Kleaf)

on:
  schedule:
    # 北京时间每周日晚上 22:23 自动触发（UTC 14:23），避开整点与算力高峰
    - cron: '23 14 * * 0'
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest Repository URL'
        required: true
        default: 'https://android.googlesource.com/kernel/manifest'
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'gs-android17-6.18-gs101'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 优先清理 Runner 磁盘空间，腾出约 40GB+ 空间
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 8192
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    # 2. 拉取工作流代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 3. 安装依赖与 Repo 工具（使用 libbz2-dev）
    - name: Install Dependencies & Setup Repo
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison build-essential libssl-dev libelf-dev \
          git-core gnupg ccache zip curl zlib1g-dev python3 python3-pip libbz2-dev
        
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH

    # 4. 同步内核源码，并在成功后直接自动删除 .repo (释放 39G 空间)
    - name: Sync Source Code & Auto Clear .repo
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        mkdir workspace
        cd workspace
        
        repo init -u ${{ github.event.inputs.MANIFEST_URL }} \
                  -b ${{ github.event.inputs.MANIFEST_BRANCH }} \
                  --depth=1
        
        repo sync -c --no-tags --no-clone-bundle -j$(nproc) && rm -rf .repo

    # 5. 执行 Bazel/Kleaf 编译
    - name: Build Kernel with Kleaf
      run: |
        cd workspace
        
        tools/bazel run \
          --config=raviole \
          --config=release \
          --config=fast \
          --local_ram_resources=HOST_RAM*0.8 \
          --jobs=$(nproc) \
          --nosandbox_debug \
          --discard_analysis_cache \
          //private/google-modules/soc/gs:slider_dist

    # 6. 直接上传 dist 目录，由 Artifact 自动打包为 raviole-kernel-slider.zip
    - name: Upload Kernel Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: raviole-kernel-slider
        path: workspace/out/slider/dist/
        if-no-files-found: error
