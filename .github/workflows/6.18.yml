name: Pixel 6 Kernel Build (Kleaf)

on:
  schedule:
    - cron: '23 14 * * 0'
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest Repository URL'
        required: true
        default: 'https://android.googlesource.com/kernel/manifest'
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'gs-android17-6.18-gs101'
      PUBLISH_TYPE:
        description: 'Choose Artifact Publishing Type'
        required: true
        type: choice
        default: 'both'
        options:
          - 'release'
          - 'artifact'
          - 'both'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 8192
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies & Setup Repo
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison build-essential libssl-dev libelf-dev \
          git-core gnupg ccache zip curl zlib1g-dev python3 python3-pip libbz2-dev
        
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH

    - name: Sync Source Code & Get Commit SHA
      id: sync
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        mkdir workspace
        cd workspace
        
        BRANCH="${{ github.event.inputs.MANIFEST_BRANCH || 'gs-android17-6.18-gs101' }}"
        
        repo init -u ${{ github.event.inputs.MANIFEST_URL || 'https://android.googlesource.com/kernel/manifest' }} \
                  -b "${BRANCH}" \
                  --depth=1
        
        repo sync -c --no-tags --no-clone-bundle -j$(nproc)
        
        COMMIT_SHA=$(git -C common rev-parse --short=8 HEAD)
        echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_OUTPUT
        echo "BRANCH=${BRANCH}" >> $GITHUB_OUTPUT
        
        rm -rf .repo

    - name: Build Kernel with Kleaf
      run: |
        cd workspace
        cd common
        echo "CONFIG_TMPFS_POSIX_ACL=y" >> arch/arm64/configs/defconfig
        git add arch/arm64/configs/defconfig
        git commit -m "kconfig: enable CONFIG_TMPFS_POSIX_ACL"
        cd ..
        tools/bazel run \
          --config=raviole \
          --config=release \
          --config=fast \
          --jobs=$(nproc) \
          --nosandbox_debug \
          --discard_analysis_cache \
          //private/google-modules/soc/gs:slider_dist

    - name: Package Dist Artifacts
      run: |
        cd workspace/out/slider/dist
        zip -0 -r ../../../../raviole-kernel-slider.zip *

    - name: Generate Release Tag & Title
      id: tag
      run: |
        DATE_STR=$(date +'%Y.%m.%d')
        SHA="${{ steps.sync.outputs.COMMIT_SHA }}"
        BRANCH="${{ steps.sync.outputs.BRANCH }}"
        TAG_NAME="${DATE_STR}-${BRANCH}-${SHA}"
        echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "RELEASE_NAME=Pixel 6 Kernel Build ${TAG_NAME}" >> $GITHUB_OUTPUT

    - name: Upload Actions Artifact (Store Mode)
      if: ${{ github.event_name == 'schedule' || github.event.inputs.PUBLISH_TYPE == 'artifact' || github.event.inputs.PUBLISH_TYPE == 'both' }}
      uses: actions/upload-artifact@v4
      with:
        name: raviole-kernel-slider-${{ steps.tag.outputs.RELEASE_TAG }}
        path: raviole-kernel-slider.zip
        compression-level: 0

    - name: Create GitHub Release
      if: ${{ github.event_name == 'schedule' || github.event.inputs.PUBLISH_TYPE == 'release' || github.event.inputs.PUBLISH_TYPE == 'both' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: ${{ steps.tag.outputs.RELEASE_NAME }}
        body: |
          ### Pixel 6 Series(raviole/gs101) Kernel Build
          
          - **Manifest Branch**: `${{ steps.sync.outputs.BRANCH }}`
          - **Kernel Commit**: `${{ steps.sync.outputs.COMMIT_SHA }}`
          - **Trigger**: `${{ github.event_name }}`
        files: |
          raviole-kernel-slider.zip
