name: Pixel 6 Kernel Build (Kleaf)

on:
  schedule:
    # 北京时间每周日晚上 22:23 自动触发（UTC 14:23）
    - cron: '23 14 * * 0'
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest Repository URL'
        required: true
        default: 'https://android.googlesource.com/kernel/manifest'
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'gs-android17-6.18-gs101'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 必须优先清理磁盘空间（防止 apt-get 或 checkout 报 No space left）
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 8192
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    # 2. 拉取仓库代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 3. 安装必要依赖与 Repo 工具
    - name: Install Dependencies & Setup Repo
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison build-essential libssl-dev libelf-dev \
          git-core gnupg ccache zip curl zlib1g-dev python3 python3-pip libbz2-dev
        
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH

    # 4. 同步内核源码
    - name: Sync Source Code
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        mkdir workspace
        cd workspace
        
        repo init -u ${{ github.event.inputs.MANIFEST_URL }} \
                  -b ${{ github.event.inputs.MANIFEST_BRANCH }} \
                  --depth=1
        
        repo sync -c --no-tags --no-clone-bundle -j$(nproc)

    # 5. 执行 Bazel/Kleaf 编译
    - name: Build Kernel with Kleaf
      run: |
        cd workspace
        
        tools/bazel run \
          --config=raviole \
          --config=release \
          --config=fast \
          --local_ram_resources=HOST_RAM*0.8 \
          --jobs=$(nproc) \
          //private/google-modules/soc/gs:slider_dist

    # 6. 打包 out/slider/dist 目录（仅存储格式 zip -0）
    - name: Package Dist Artifacts (Store only)
      run: |
        cd workspace/out/slider/dist
        zip -0 -r ../../../raviole-kernel-slider.zip .

    # 7. 上传 zip 产物
    - name: Upload Kernel Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: raviole-kernel-slider
        path: workspace/raviole-kernel-slider.zip
        if-no-files-found: error
